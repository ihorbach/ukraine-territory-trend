name: Update territory chart

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-chart.yml"
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: territory-chart-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Use latest main on retried runs
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/territory_chart.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/territory.csv data/summary.json index.html
          git diff --cached --quiet || git commit -m "data: update territory trend"
          git push
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
